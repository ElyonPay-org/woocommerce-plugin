name: Build release zip

# À la demande seulement (Actions -> Run workflow, ou
# `gh workflow run build.yml --ref <branche>`) : construit le zip tel qu'il
# serait livré, pour le vérifier avant de poser un tag. Sur un tag X.Y.Z, c'est
# deploy.yml qui publie sur WordPress.org et attache le zip à la release GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributable zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      - name: Install runtime dependencies (bundles the ElyonPay SDK into vendor/)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Lint every shipped PHP file with PHP 7.4 (the plugin's minimum)
        run: find . -name '*.php' -not -path './tests/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Assemble the plugin folder (honouring .distignore)
        run: |
          SLUG=elyonpay-for-woocommerce
          mkdir -p "build/${SLUG}"
          rsync -a ./ "build/${SLUG}/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.distignore' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '.wordpress-org' \
            --exclude 'composer.lock' \
            --exclude 'README.md' \
            --exclude 'build'
          cd build && zip -r "${SLUG}.zip" "${SLUG}" >/dev/null
          echo "Contenu du zip :" && unzip -l "${SLUG}.zip"

      - name: Upload zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: elyonpay-for-woocommerce
          path: build/elyonpay-for-woocommerce.zip
